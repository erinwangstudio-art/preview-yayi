body{margin:0}
.yy{--font:Inter,-apple-system,'PingFang SC',system-ui,sans-serif}

.yy .sb{width:240px;height:100%;min-height:100%;box-sizing:border-box;background:#F7F7F8;border-right:1px solid #E4E4E7;display:flex;flex-direction:column;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}

.yy .nav .ic{flex:0 0 auto;color:#A1A1AA;display:flex;align-items:center}
.yy .nav:hover{background:#EDEDEF;color:#18181B}
.yy .nav[data-active="true"]{background:#4F46E5;border-color:#4F46E5;color:#fff;font-weight:500}
.yy .nav[data-active="true"] .ic{color:#fff}
.yy .nav:focus-visible{outline:2px solid #6366F1;outline-offset:-2px}
.yy .sep{height:1px;background:#E9E9EB;margin:6px 16px}
.yy .sb-b{margin-top:auto;flex:0 0 auto;border-top:1px solid #E9E9EB;padding:10px 12px 12px}

<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["home", "inspire", "design", "fulfill", "records", "pattern", "layout", "pricing", "campaign", "stock", "delist", "catalog", "products", "orders", "shop", "settings"], "default": "home", "section": "状态"}, "$preview": {"width": 240, "height": 800}}'>
class Component extends DCLogic {
  renderVals() {
    const KEYS = ["home", "inspire", "design", "fulfill", "records", "pattern", "layout", "pricing", "campaign", "stock", "delist", "catalog", "products", "orders", "shop", "settings"];
    let a = this.props.active;
    if (a === 'detail') a = 'orders';
    if (KEYS.indexOf(a) < 0) a = 'home';
    const on = {}, current = {};
    for (const k of KEYS) {
      on[k] = a === k;
      current[k] = a === k ? 'page' : undefined;
    }
    return { on, current, noop: () => {} };
  }
}
</script>
