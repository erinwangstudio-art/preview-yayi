];
const ELEM_LABELS = ['艺术字', '动物', '花卉', '几何图形', '自然风光', '蝴蝶', '节日', '星空'];

class Component extends DCLogic {
  state = { platform: 'temu', sort: 'new', sel: [], page: 1, use: 2, elems: [], risks: [], docs: true, docFocus: 0 };

  selList() { return this.state.sel || []; }

  toggleCard(id) {
    const sel = this.selList().slice();
    const i = sel.indexOf(id);
    if (i >= 0) sel.splice(i, 1); else sel.push(id);
    this.setState({ sel });
  }

  toggleAll() {
    const all = this.selList().length === CARDS.length;
    this.setState({ sel: all ? [] : CARDS.map((c) => c.id) });
  }

  toggleFrom(listName, label) {
    const list = (this.state[listName] || []).slice();
    const i = list.indexOf(label);
    if (i >= 0) list.splice(i, 1); else list.push(label);
    this.setState({ [listName]: list });
  }

  goPage(n) {
    const p = Math.max(1, Math.min(84, n));
    this.setState({ page: p });
  }

  renderVals() {
    const st = this.state;
    const sel = this.selList();
    const sort = st.sort;

    const plats = [
      { label: 'Temu', active: st.platform === 'temu', pick: () => this.setState({ platform: 'temu' }) },
      { label: 'Shein', active: st.platform === 'shein', pick: () => this.setState({ platform: 'shein' }) }
    ];
    const sorts = [
      { label: '最新上架', active: sort === 'new', pick: () => this.setState({ sort: 'new' }) },
      { label: '销量最高', active: sort === 'sales', pick: () => this.setState({ sort: 'sales' }) },
      { label: '出现频次最高', active: sort === 'freq', pick: () => this.setState({ sort: 'freq' }) }
    ];
    const uses = [
      { label: '全部', active: st.use === 0, pick: () => this.setState({ use: 0 }) },
      { label: '已使用', active: st.use === 1, pick: () => this.setState({ use: 1 }) },
      { label: '未使用', active: st.use === 2, pick: () => this.setState({ use: 2 }) }
    ];
    const elems = ELEM_LABELS.map((label) => ({
      label,
      on: (st.elems || []).indexOf(label) >= 0,
      pick: () => this.toggleFrom('elems', label)
    }));
    const risks = ['未侵权', '未检测', '检测中'].map((label) => ({
      label,
      on: (st.risks || []).indexOf(label) >= 0,
      pick: () => this.toggleFrom('risks', label)
    }));

    const cards = CARDS.map((c) => ({
      img: c.img,
      title: c.title,
      sales: c.sales,
      uses: c.uses + ' 款',
      tag1: c.tag1,
      tag2: c.tag2,
      risk: c.risk,
      riskKey: c.riskKey,
      gen: c.gen > 0 ? c.gen + ' 次' : '—',
      date: c.date,
      badge: c.badge,
      catLine: c.catLine,
      sel: sel.indexOf(c.id) >= 0,
      toggle: () => this.toggleCard(c.id)
    }));

    const pageLabels = [1, 2, 3, 4, 5, 6, '…', 84];
    const pages = pageLabels.map((p) => ({
      label: String(p),
      gap: p === '…',
      active: p === st.page,
      pick: () => { if (p !== '…') this.goPage(Number(p)); }
    }));

    return {
      docsOn: !!st.docs,
      docsOnAttr: st.docs ? 'true' : 'false',
      docTitle: String(this.props.docTitle ?? ''),
      f1: st.docFocus === 1 ? 'true' : 'false',
      f2: st.docFocus === 2 ? 'true' : 'false',
      f3: st.docFocus === 3 ? 'true' : 'false',
      f4: st.docFocus === 4 ? 'true' : 'false',
      f5: st.docFocus === 5 ? 'true' : 'false',
      toggleDocs: () => this.setState({ docs: !st.docs, docFocus: 0 }),
      pin1: () => this.setState({ docs: true, docFocus: 1 }),
      pin2: () => this.setState({ docs: true, docFocus: 2 }),
      pin3: () => this.setState({ docs: true, docFocus: 3 }),
      pin4: () => this.setState({ docs: true, docFocus: 4 }),
      pin5: () => this.setState({ docs: true, docFocus: 5 }),
      plats,
      sourceText: st.platform === 'temu' ? '数据源：Temu 全站图案 · 近 90 天' : '数据源：Shein 全站图案 · 近 90 天',
      sorts,
      uses,
      elems,
      risks,
      cards,
      selCount: sel.length,
      allSel: sel.length === CARDS.length && CARDS.length > 0,
      toggleAll: () => this.toggleAll(),
      pages,
      pageNo: String(st.page),
      prevPage: () => this.goPage(st.page - 1),
      nextPage: () => this.goPage(st.page + 1)
    };
  }
}
</script>
