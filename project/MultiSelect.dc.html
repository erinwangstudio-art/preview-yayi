<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>下拉多选</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.yy{--p:#6366F1;--ph:#4F46E5;--ink:#18181B;--ink2:#27272A;--muted:#71717A;--faint:#A1A1AA;--line:#E4E4E7;--line2:#D4D4D8;--bg2:#F4F4F5;--font:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',system-ui,sans-serif}
.ms{position:relative;width:100%;box-sizing:border-box;font-family:var(--font);-webkit-font-smoothing:antialiased}
.ms-label{font-size:12.5px;color:var(--ink2);font-weight:600;line-height:1.4;margin-bottom:8px}
.ms-field{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:36px;padding:4px 30px 4px 8px;border:1px solid var(--line);border-radius:8px;background:#FFFFFF;cursor:pointer;transition:border-color .14s ease,box-shadow .14s ease}
.ms-field:hover{border-color:var(--line2)}
.ms-field[data-open="true"]{border-color:var(--p);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
.ms-field:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ms-field[data-disabled="true"]{background:#FAFAFA;opacity:.7;cursor:not-allowed}
.ms-tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 8px;background:#EEF2FF;color:#4F46E5;border-radius:6px;font-size:12px;font-weight:500}
.ms-tag-x{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:4px;background:none;color:inherit;font-family:inherit;font-size:13px;line-height:1;cursor:pointer}
.ms-tag-x:hover{background:rgba(99,102,241,.16)}
.ms-tag-x:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.ms .ph{color:var(--faint);font-size:13px}
.ms-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--faint);transition:transform .14s ease}
.ms-field[data-open="true"] .ms-arrow{transform:translateY(-50%) rotate(180deg)}
.ms-pop{position:absolute;z-index:50;top:100%;left:0;right:0;margin-top:6px;background:#FFFFFF;border:1px solid #E4E4E7;border-radius:10px;box-shadow:0 12px 32px rgba(24,24,27,.16);padding:6px;box-sizing:border-box;animation:ms-in .12s ease}
@keyframes ms-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.ms-search{width:100%;box-sizing:border-box;height:30px;margin:0 0 4px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none}
.ms-search:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
.ms-list{max-height:200px;overflow-y:auto}
.ms-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.ms-opt:hover,.ms-opt[data-hi="true"]{background:var(--bg2)}
.ms-opt[data-disabled="true"]{opacity:.45;cursor:not-allowed}
.ms-opt .cb{width:16px;height:16px;box-sizing:border-box;border-radius:4px;border:1.5px solid var(--line2);background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#FFFFFF;flex:0 0 auto;transition:background .12s ease,border-color .12s ease}
.ms-opt .cb svg{opacity:0;transform:scale(.7);transition:opacity .12s ease,transform .12s ease}
.ms-opt[data-on="true"] .cb{background:var(--p);border-color:var(--p)}
.ms-opt[data-on="true"] .cb svg{opacity:1;transform:scale(1)}
.ms-opt-txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-empty{padding:12px 10px;text-align:center;font-size:12.5px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){.ms-arrow,.ms-pop,.ms-opt .cb,.ms-opt .cb svg{transition:none;animation:none}}
</style>
</helmet>

<div class="yy ms" onBlur="{{ onBlur }}">

<sc-if value="{{ hasLabel }}">
<div class="ms-label">{{ label }}</div>
</sc-if>

<div class="ms-field" id="{{ uid }}-field" role="combobox" tabindex="{{ tab }}" aria-haspopup="listbox" aria-expanded="{{ openAttr }}" aria-controls="{{ listId }}" aria-label="{{ ariaLabel }}" aria-disabled="{{ disabledAttr }}" data-open="{{ openAttr }}" data-disabled="{{ disabledAttr }}" onClick="{{ toggle }}" onKeyDown="{{ onKey }}">

<sc-for list="{{ tags }}" as="t">
<span class="ms-tag">{{ t.label }}<button class="ms-tag-x" type="button" aria-label="移除 {{ t.label }}" onClick="{{ t.remove }}">×</button></span>
</sc-for>

<sc-if value="{{ emptySel }}">
<span class="ph">{{ placeholder }}</span>
</sc-if>

<sc-if value="{{ more }}">
<span class="ms-tag" style="background:#F4F4F5;color:#52525B;padding:0 8px">+{{ moreCount }}</span>
</sc-if>

<span class="ms-arrow">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
</div>

<sc-if value="{{ open }}">
<div class="ms-pop" id="{{ listId }}" role="listbox" aria-multiselectable="true" aria-label="{{ ariaLabel }}">

<sc-if value="{{ searchable }}">
<input class="ms-search" id="{{ uid }}-search" type="text" placeholder="搜索选项" value="{{ q }}" aria-label="搜索选项" onChange="{{ onSearch }}" onKeyDown="{{ searchKey }}" />
</sc-if>

<div class="ms-list">
<sc-for list="{{ opts }}" as="o">
<div class="ms-opt" role="option" id="{{ o.id }}" aria-selected="{{ o.on }}" aria-disabled="{{ o.disabledAttr }}" data-on="{{ o.on }}" data-hi="{{ o.hi }}" data-disabled="{{ o.disabledAttr }}" onClick="{{ o.toggle }}" onMouseDown="{{ o.hold }}" onMouseEnter="{{ o.hover }}">
<span class="cb" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.5 12 13 4.5"></path></svg></span>
<span class="ms-opt-txt">{{ o.label }}</span>
</div>
</sc-for>
<sc-if value="{{ noMatch }}">
<div class="ms-empty">没有匹配的选项</div>
</sc-if>
</div>

</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"options":{"editor":"text","default":"天猫\n抖音\n小红书\n独立站\n拼多多","section":"内容"},"label":{"editor":"text","default":"销售渠道","section":"内容"},"checked":{"editor":"text","default":"0,1","section":"内容"},"placeholder":{"editor":"text","default":"请选择渠道","section":"内容"},"max":{"editor":"int","default":0,"min":0,"max":50,"section":"校验"},"maxTags":{"editor":"int","default":3,"min":0,"max":20,"section":"样式"},"searchable":{"editor":"boolean","default":true,"section":"交互"},"disabled":{"editor":"boolean","default":false,"section":"状态"},"$preview":{"width":280,"height":96}}'>
class Component extends DCLogic {
  state = {};

  uid = 'ms-' + Math.random().toString(36).slice(2, 8);

  options() {
    return String(this.props.options ?? '')
      .split(/[\n\r,，、;；]+/)
      .map((s) => s.trim())
      .filter(Boolean);
  }

  parse() {
    const raw = this.state.checked !== undefined ? this.state.checked : (this.props.checked ?? '');
    const s = String(raw)
      .split(/[\n\r,，、;；\s]+/)
      .map((x) => parseInt(x, 10))
      .filter((n) => !isNaN(n));
    return new Set(s);
  }

  focusField() {
    if (typeof document === 'undefined') return;
    const el = document.getElementById(this.uid + '-field');
    if (el) el.focus();
  }

  renderVals() {
    const truthy = (v) => v === true || v === 'true';
    const raw = this.options();
    const sel = this.parse();
    const open = this.state.open === true && !truthy(this.props.disabled);
    const q = String(this.state.q ?? '');
    const hi = this.state.hi ?? 0;
    const disabled = truthy(this.props.disabled);
    const max = Math.max(0, Number(this.props.max ?? 0) || 0);
    const maxTags = Math.max(0, Number(this.props.maxTags === undefined ? 3 : this.props.maxTags) || 0);
    const searchable = this.props.searchable === undefined ? true : truthy(this.props.searchable);
    const uid = this.uid;
    const listId = uid + '-list';

    const visible = raw
      .map((t, i) => ({ t, i }))
      .filter((o) => q === '' || o.t.toLowerCase().includes(q.toLowerCase()));

    const toggleIdx = (i) => {
      if (disabled) return;
      const s = this.parse();
      if (s.has(i)) s.delete(i);
      else if (max === 0 || s.size < max) s.add(i);
      else return;
      this.setState({ checked: Array.from(s).join(',') });
    };

    const selectedLabels = raw.filter((t, i) => sel.has(i));
    const shown = maxTags > 0 ? selectedLabels.slice(0, maxTags) : selectedLabels;

    return {
      uid,
      listId,
      label: this.props.label ?? '',
      hasLabel: (this.props.label ?? '') !== '',
      ariaLabel: this.props.label || this.props.placeholder || '多选',
      placeholder: this.props.placeholder ?? '请选择',
      open,
      openAttr: open ? 'true' : 'false',
      disabledAttr: disabled ? 'true' : 'false',
      tab: disabled ? '-1' : '0',
      searchable,
      q,
      emptySel: selectedLabels.length === 0,
      more: selectedLabels.length > shown.length,
      moreCount: selectedLabels.length - shown.length,
      tags: shown.map((t) => {
        const i = raw.indexOf(t);
        return {
          label: t,
          remove: (e) => {
            e.stopPropagation();
            if (disabled) return;
            const s = this.parse();
            s.delete(i);
            this.setState({ checked: Array.from(s).join(',') });
            setTimeout(() => this.focusField(), 0);
          }
        };
      }),
      noMatch: visible.length === 0,
      opts: visible.map((o, vi) => {
        const on = sel.has(o.i);
        const atMax = max > 0 && sel.size >= max && !on;
        return {
          id: `${uid}-opt-${o.i}`,
          label: o.t,
          on,
          hi: vi === hi,
          disabledAttr: atMax ? 'true' : 'false',
          hold: (e) => e.preventDefault(),
          hover: () => { if (hi !== vi) this.setState({ hi: vi }); },
          toggle: () => { if (!atMax) toggleIdx(o.i); }
        };
      }),
      toggle: (e) => {
        if (disabled) return;
        if (e.target.closest('.ms-tag-x')) return;
        const next = !open;
        this.setState({ open: next, hi: 0, q: next ? '' : q });
        if (next && searchable) setTimeout(() => {
          if (typeof document === 'undefined') return;
          const s = document.getElementById(uid + '-search');
          if (s) s.focus();
        }, 0);
      },
      onBlur: (e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) this.setState({ open: false });
      },
      onSearch: (e) => this.setState({ q: e.target.value, hi: 0 }),
      searchKey: (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();
          this.setState({ open: false });
          setTimeout(() => this.focusField(), 0);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const target = visible[hi];
          if (target) toggleIdx(target.i);
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (visible.length) this.setState({ hi: Math.min(visible.length - 1, hi + 1) });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (visible.length) this.setState({ hi: Math.max(0, hi - 1) });
        }
      },
      onKey: (e) => {
        if (disabled) return;
        if (e.target.classList && e.target.classList.contains('ms-search')) return;
        const k = e.key;
        if (k === 'Enter' || k === ' ') {
          e.preventDefault();
          if (!open) this.setState({ open: true, hi: 0, q: '' });
          else if (visible[hi]) toggleIdx(visible[hi].i);
        } else if (k === 'ArrowDown' || k === 'ArrowUp') {
          e.preventDefault();
          if (!open) this.setState({ open: true, hi: 0, q: '' });
          else {
            const next = k === 'ArrowDown' ? Math.min(visible.length - 1, hi + 1) : Math.max(0, hi - 1);
            this.setState({ hi: next });
          }
        } else if (k === 'Escape') {
          if (open) { e.preventDefault(); this.setState({ open: false }); }
        } else if (k === 'Backspace') {
          if (!open && selectedLabels.length) {
            e.preventDefault();
            const s = this.parse();
            const last = Math.max.apply(null, Array.from(s));
            s.delete(last);
            this.setState({ checked: Array.from(s).join(',') });
          }
        } else if (k === 'Tab') {
          if (open) this.setState({ open: false });
        }
      }
    };
  }
}
</script>
</body>
</html>
