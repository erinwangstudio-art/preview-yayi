<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>日期选择器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.yy{--p:#6366F1;--ph:#4F46E5;--ink:#18181B;--ink2:#27272A;--muted:#71717A;--faint:#A1A1AA;--line:#E4E4E7;--line2:#D4D4D8;--bg2:#F4F4F5;--font:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',system-ui,sans-serif}
.dp{position:relative;width:100%;box-sizing:border-box;font-family:var(--font);-webkit-font-smoothing:antialiased}
.dp-label{font-size:12.5px;color:var(--ink2);font-weight:600;line-height:1.4;margin-bottom:8px}
.dp-field{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#FFFFFF;font-family:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .14s ease,box-shadow .14s ease}
.dp-field:hover{border-color:var(--line2)}
.dp-field[data-open="true"]{border-color:var(--p);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
.dp-field:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.dp-field[data-disabled="true"]{background:#FAFAFA;opacity:.7;cursor:not-allowed}
.dp-field .ph{color:var(--faint)}
.dp-field svg{flex:0 0 auto}
.dp-caret{margin-left:auto;color:var(--faint);transition:transform .14s ease}
.dp-field[data-open="true"] .dp-caret{transform:rotate(180deg)}
.dp-pop{position:absolute;z-index:50;top:calc(100% + 6px);left:0;margin-top:0;background:#FFFFFF;border:1px solid #E4E4E7;border-radius:10px;box-shadow:0 12px 32px rgba(24,24,27,.16);padding:14px;width:276px;box-sizing:border-box;animation:dp-in .12s ease}
@keyframes dp-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:4px}
.dp-head .nav{width:26px;height:26px;border:0;border-radius:6px;background:var(--bg2);color:var(--ink2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1}
.dp-head .nav:hover{background:#D4D4D8}
.dp-head .nav:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.dp-head .ttl{font-size:13px;font-weight:600;color:var(--ink);text-align:center;flex:1 1 auto}
.dp-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.dp-wk span{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-days .d{position:relative;height:30px;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:12.5px;color:var(--ink);border:0;border-radius:6px;background:none;cursor:pointer}
.dp-days .d:hover{background:var(--bg2)}
.dp-days .d:focus-visible{outline:2px solid var(--p);outline-offset:-2px}
.dp-days .d[data-mut="true"]{color:#D4D4D8}
.dp-days .d[data-today="true"]::after{content:"";position:absolute;bottom:4px;width:3px;height:3px;border-radius:50%;background:var(--p)}
.dp-days .d[data-sel="true"]{background:var(--p);color:#FFFFFF;font-weight:600}
.dp-days .d[data-sel="true"]::after{background:#FFFFFF}
.dp-foot{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #F4F4F5}
.dp-foot button{height:28px;padding:0 12px;border:0;border-radius:6px;font-family:inherit;font-size:12.5px;cursor:pointer;background:var(--bg2);color:var(--ink2)}
.dp-foot button:hover{background:#D4D4D8}
.dp-foot button:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.dp-foot button.pri{background:var(--p);color:#FFFFFF;font-weight:500}
.dp-foot button.pri:hover{background:var(--ph)}
@media (prefers-reduced-motion:reduce){.dp-field,.dp-caret{transition:none}.dp-pop{animation:none}}
</style>
</helmet>

<div class="yy dp">

<sc-if value="{{ hasLabel }}">
<div class="dp-label">{{ label }}</div>
</sc-if>

<div onBlur="{{ onBlur }}">

<button class="dp-field" id="{{ uid }}-trigger" type="button" data-open="{{ openAttr }}" data-disabled="{{ disabledAttr }}" disabled="{{ isDisabled }}" aria-haspopup="dialog" aria-expanded="{{ openAttr }}" onClick="{{ toggle }}" onKeyDown="{{ triggerKey }}">
<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="{{ iconColor }}" stroke-width="1.4" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="1.6"></rect><path d="M2.5 6.2h11M5.5 1.8v2.4M10.5 1.8v2.4" stroke-linecap="round"></path></svg>
<span class="{{ placeholderClass }}">{{ display }}</span>
<svg class="dp-caret" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

<sc-if value="{{ open }}">
<div class="dp-pop" role="dialog" aria-modal="false" aria-label="{{ dialogLabel }}" onKeyDown="{{ popKey }}">
<div class="dp-head">
<button class="nav" type="button" aria-label="上一年" onClick="{{ prevYear }}">«</button>
<button class="nav" type="button" aria-label="上个月" onClick="{{ prev }}">‹</button>
<div class="ttl" aria-live="polite">{{ ym }}</div>
<button class="nav" type="button" aria-label="下个月" onClick="{{ next }}">›</button>
<button class="nav" type="button" aria-label="下一年" onClick="{{ nextYear }}">»</button>
</div>
<div class="dp-wk" aria-hidden="true">
<sc-for list="{{ week }}" as="w">
<span>{{ w }}</span>
</sc-for>
</div>
<div class="dp-days">
<sc-for list="{{ cells }}" as="c">
<button class="d" type="button" data-i="{{ c.i }}" data-mut="{{ c.mut }}" data-today="{{ c.today }}" data-sel="{{ c.sel }}" tabindex="{{ c.tab }}" aria-label="{{ c.aria }}" aria-current="{{ c.current }}" aria-pressed="{{ c.sel }}" onClick="{{ c.pick }}">{{ c.day }}</button>
</sc-for>
</div>
<div class="dp-foot">
<button type="button" onClick="{{ clear }}">清空</button>
<button class="pri" type="button" onClick="{{ today }}">今天</button>
</div>
</div>
</sc-if>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"下单日期","section":"内容"},"placeholder":{"editor":"text","default":"请选择日期","section":"内容"},"value":{"editor":"text","default":"","section":"内容"},"format":{"editor":"enum","options":["YYYY-MM-DD","YYYY/MM/DD","YYYY年MM月DD日"],"default":"YYYY-MM-DD","section":"样式"},"weekStart":{"editor":"enum","options":["sun","mon"],"default":"sun","section":"样式"},"disabled":{"editor":"boolean","default":false,"section":"状态"},"$preview":{"width":280,"height":96}}'>
class Component extends DCLogic {
  state = {};

  uid = 'dp-' + Math.random().toString(36).slice(2, 8);

  pad(n) { return String(n).padStart(2, '0'); }

  fmt(y, m, d) {
    const f = this.props.format ?? 'YYYY-MM-DD';
    if (f === 'YYYY/MM/DD') return `${y}/${this.pad(m)}/${this.pad(d)}`;
    if (f === 'YYYY年MM月DD日') return `${y}年${this.pad(m)}月${this.pad(d)}日`;
    return `${y}-${this.pad(m)}-${this.pad(d)}`;
  }

  focusTrigger() {
    if (typeof document === 'undefined') return;
    const el = document.getElementById(this.uid + '-trigger');
    if (el) el.focus();
  }

  parseVal(str) {
    const nums = String(str ?? '').match(/\d+/g);
    if (!nums || nums.length < 3) return null;
    const y = Number(nums[0]), m = Number(nums[1]), d = Number(nums[2]);
    if (!y || !m || !d) return null;
    return { y, m, d };
  }

  renderVals() {
    const truthy = (v) => v === true || v === 'true';
    const val = String(this.state.value !== undefined ? this.state.value : (this.props.value ?? ''));
    const open = this.state.open === true && !truthy(this.props.disabled);
    const now = new Date();
    const fromVal = this.parseVal(val);
    const cur = this.state.cursor || (fromVal ? { y: fromVal.y, m: fromVal.m } : { y: now.getFullYear(), m: now.getMonth() + 1 });
    const y = cur.y, m = cur.m;
    const mon = this.props.weekStart === 'mon';

    const first = new Date(y, m - 1, 1);
    const startDow = mon ? (first.getDay() + 6) % 7 : first.getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const prevDays = new Date(y, m - 1, 0).getDate();
    const todayStr = this.fmt(now.getFullYear(), now.getMonth() + 1, now.getDate());

    const cells = [];
    const prevDate = (d) => ({ y: m === 1 ? y - 1 : y, m: m === 1 ? 12 : m - 1, d });
    const nextDate = (d) => ({ y: m === 12 ? y + 1 : y, m: m === 12 ? 1 : m + 1, d });

    const push = (dt, mut) => {
      const str = this.fmt(dt.y, dt.m, dt.d);
      cells.push({
        i: cells.length,
        day: dt.d,
        mut: mut ? 'true' : 'false',
        today: str === todayStr ? 'true' : 'false',
        sel: str === val ? 'true' : 'false',
        current: str === todayStr ? 'date' : undefined,
        tab: '-1',
        aria: `${dt.y}年${dt.m}月${dt.d}日`,
        pick: () => {
          this.setState({ value: str, open: false, cursor: { y: dt.y, m: dt.m } });
          setTimeout(() => this.focusTrigger(), 0);
        }
      });
    };

    for (let i = startDow - 1; i >= 0; i--) push(prevDate(prevDays - i), true);
    for (let d = 1; d <= daysInMonth; d++) push({ y, m, d }, false);
    const remaining = 42 - cells.length;
    for (let d = 1; d <= remaining; d++) push(nextDate(d), true);

    let focusIdx = cells.findIndex((c) => c.sel === 'true');
    if (focusIdx < 0) focusIdx = cells.findIndex((c) => c.today === 'true');
    if (focusIdx < 0) focusIdx = startDow;
    if (cells[focusIdx]) cells[focusIdx].tab = '0';

    const week = mon ? ['一', '二', '三', '四', '五', '六', '日'] : ['日', '一', '二', '三', '四', '五', '六'];
    const disabled = truthy(this.props.disabled);

    return {
      uid: this.uid,
      label: this.props.label ?? '',
      hasLabel: (this.props.label ?? '') !== '',
      placeholder: this.props.placeholder ?? '请选择日期',
      display: val || (this.props.placeholder ?? '请选择日期'),
      placeholderClass: val ? '' : 'ph',
      iconColor: val ? '#71717A' : '#A1A1AA',
      open,
      openAttr: open ? 'true' : 'false',
      disabledAttr: disabled ? 'true' : 'false',
      isDisabled: disabled,
      ym: `${y}年${m}月`,
      dialogLabel: (this.props.label || '选择日期') + '，' + `${y}年${m}月`,
      week,
      cells,
      toggle: () => {
        if (disabled) return;
        if (open) this.setState({ open: false });
        else this.setState({ open: true, cursor: { y, m } });
      },
      triggerKey: (e) => {
        if (disabled) return;
        if (e.key === 'ArrowDown' && !open) { e.preventDefault(); this.setState({ open: true, cursor: { y, m } }); }
        else if (e.key === 'Escape' && open) { e.preventDefault(); this.setState({ open: false }); }
      },
      onBlur: (e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) this.setState({ open: false });
      },
      popKey: (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          this.setState({ open: false });
          setTimeout(() => this.focusTrigger(), 0);
          return;
        }
        const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
        if (moves[e.key] !== undefined) {
          const el = e.target.closest('.d');
          if (!el) return;
          e.preventDefault();
          const i = Number(el.getAttribute('data-i'));
          const next = e.target.closest('.dp-days').querySelector(`.d[data-i="${i + moves[e.key]}"]`);
          if (next) next.focus();
        } else if (e.key === 'Home' || e.key === 'End') {
          const el = e.target.closest('.d');
          if (!el) return;
          e.preventDefault();
          const all = e.target.closest('.dp-days').querySelectorAll('.d');
          const target = e.key === 'Home' ? all[0] : all[all.length - 1];
          if (target) target.focus();
        }
      },
      prev: () => this.setState({ cursor: { y: m === 1 ? y - 1 : y, m: m === 1 ? 12 : m - 1 } }),
      next: () => this.setState({ cursor: { y: m === 12 ? y + 1 : y, m: m === 12 ? 1 : m + 1 } }),
      prevYear: () => this.setState({ cursor: { y: y - 1, m } }),
      nextYear: () => this.setState({ cursor: { y: y + 1, m } }),
      clear: () => this.setState({ value: '' }),
      today: () => {
        this.setState({ value: todayStr, open: false, cursor: { y: now.getFullYear(), m: now.getMonth() + 1 } });
        setTimeout(() => this.focusTrigger(), 0);
      }
    };
  }
}
</script>
</body>
</html>
